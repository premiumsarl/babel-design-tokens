# Tokens + contracts integrity gate.
#
# dist/ and dart/lib/ are COMMITTED but GENERATED from tokens.json and
# contracts/, and consumers install them straight from git (npm git-dep /
# pub git-dep) — there is no publish step where a check could run
# (`prepublishOnly` never fires for git installs). So this workflow is the
# only enforcement point:
#
#   1. regenerate from source and fail if the committed output drifted
#   2. run the WCAG contrast gate on the (now provably fresh) output
#   3. run the contract invariants (aliases, subsets, duplicate values…)
#   4. assert npm/pub version parity (package.json == dart/pubspec.yaml)
#
# Step 3 matters more than it looks: a wrong TOKEN looks wrong, but a wrong
# CONTRACT looks fine and fails months later on one client for one value.
#
# Runs on PRs, on main, and on v* tags so a release ref is validated exactly
# as consumers will install it.
name: verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # For the "Generated Dart analyzes" step below. The Dart SDK alone, not
      # Flutter: babel_contracts.dart imports nothing.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Zero dependencies — build straight from the checkout.
      - name: Build from tokens.json + contracts/
        run: node build.mjs

      - name: Committed generated output matches the source (no drift)
        run: |
          if [ -n "$(git status --porcelain dist dart/lib)" ]; then
            echo "::error::dist/ or dart/lib is out of sync with tokens.json / contracts/ — run 'npm run build' and commit the result."
            git status --short dist dart/lib
            git diff dist dart/lib | head -100
            exit 1
          fi
          echo "generated output is in sync"

      - name: WCAG contrast gate
        run: node scripts/check-contrast.mjs

      # Also re-asserts freshness via `build.mjs --check`, so the invariants
      # are provably checked against the same bytes consumers will install.
      - name: Contract integrity gate
        run: node scripts/check-contracts.mjs

      # The generated Dart is shipped to mobile over pub; a file that does not
      # analyze is a build break in the consumer, discovered there instead of
      # here. Analyzed as a standalone package because babel_contracts.dart is
      # pure Dart (no Flutter), which keeps this step off the Flutter toolchain.
      - name: Generated Dart analyzes
        run: |
          mkdir -p /tmp/dartcheck/lib
          cp dart/lib/babel_contracts.dart /tmp/dartcheck/lib/
          printf 'name: contracts_check\nenvironment:\n  sdk: ">=3.0.0 <4.0.0"\n' \
            > /tmp/dartcheck/pubspec.yaml
          cd /tmp/dartcheck && dart pub get && dart analyze

      # check-tokens.mjs is COPIED into every consumer rather than shipped
      # (scripts/ is outside `files`), and until now nothing here exercised
      # it — so a change to the ratchet was validated by nothing until it
      # had already reddened a consumer's build.
      - name: Ratchet scope (test files excluded, real literals still counted)
        run: node scripts/__tests__/ratchet-scope.test.mjs

      - name: Version parity (package.json == dart/pubspec.yaml)
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const pkg = JSON.parse(readFileSync("package.json", "utf8")).version;
            const m = readFileSync("dart/pubspec.yaml", "utf8").match(/^version:\s*(\S+)/m);
            const pub = m && m[1];
            if (pkg !== pub) {
              console.error(`version mismatch: package.json ${pkg} != dart/pubspec.yaml ${pub}`);
              process.exit(1);
            }
            console.log(`version parity OK: ${pkg}`);
          '
