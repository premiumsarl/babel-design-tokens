name: babel_design_tokens
description: >-
  Generated Babel design tokens (colors, spacing, radius, type) and shared API
  contracts (error codes, enums, bounds) for Flutter — single sources of truth:
  black core + bronze accent (#B08D57), and the wire vocabulary shared with the
  API and admin panel; plus the index of UX principle IDs. The Dart code in
  lib/ is generated from ../tokens.json, ../contracts/ and ../principles/ by
  ../build.mjs; do not hand-edit it.
version: 0.8.1

# Private: consumed by the mobile app as a git dependency, never published to
# pub.dev. `pub` still resolves it from a git url + ref (see README.md).
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
